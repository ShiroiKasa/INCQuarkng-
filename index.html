<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>夸克增量网页重置版</title>
    <link rel="stylesheet" href="style.css">
    <script src="break_infinity.min.js"></script>
</head>
<body>
    <div style="display: flex; justify-content: center; gap: 20px; margin-bottom: 20px;">
        <button id="h1_cut" style="background:#ff6600;">夸克</button>
        <button id="h2_cut" style="background:#f78ae5;">元素</button>
        <button id="set_cut" style="background:#e9b1ff;">设置</button>
        <button id="stat_cut" style="background:#59849b;">统计</button>
    </div>

    <div id="cx_xs" style="display: none;">
        <div style="background:#9769d3;font-size: 30px;" id="cx_bt">标题</div>
        <div style="background:#9769d3;font-size: 20px;" id="cx_nr">内容</div>
    </div>

    <div id="h1">
        <h2>层级:夸克(1000夸克解锁下一层级)</h2>
        
        <div class="counter-group">
            <div class="counter" id="Quarks">夸克:0</div>
            <div class="counter" id="h1_up1s">0/s</div>
            <button id="h1_re_b" style="background:#ff6600;">夸克禁闭|原子+0</button>
        </div>

        <div class="button-group">
            <div class="button-group2">
                <button id="Quark+" onclick="h1_up1_button()">夸克+1</button>
                <button id="h1_up1_1_button">+1点击产量0级 费用:1夸克</button>
            </div>
            <div class="button-group2">
                <button id="h1_up2_button">夸克产量+0 费用:10夸克</button>
                <button id="h1_up2auto_b" style="display: none;">自动:关</button>
            </div>
            <div class="button-group2">
                <button id="h1_up3_button">夸克产量*1 费用:1000夸克</button>
                <button id="h1_up3auto_b" style="display: none;">自动:关</button>
            </div>
        </div>
    </div>

    <div id="h2" style="display: none;">
        <h2>层级:元素(???解锁下一层级)</h2>

        <div class="counter-group">
            <div class="counter_h2" id="h2_ziyuan_txt">原子:0(对夸克加成:1)</div>
            <div class="counter_h2" id="h2_ziyuans">0/s</div>
        </div>

        <div class="button-group">
            <div class="button-group2">
                <button style="background:#f78ae5;font-size: 20px;" id="h2_up1_b">氢</button>
                <button style="background:#f78ae5;font-size: 20px;" id="h2_up2_b">氦</button>
                <button style="background:#f78ae5;font-size: 20px;" id="h2_up3_b">锂</button>
                <button style="background:#f78ae5;font-size: 20px;" id="h2_up4_b">铍</button>
            </div>
        </div>
    </div>

    <div id="set" style="display: none;">
        <h2>设置</h2>
        <button id="manualSaveBtn" style="background:#e9b1ff;">立即存档</button>
        <button id="clearSaveBtn" style="background:#e9b1ff;">清空存档</button>
        <button id="bgColorBtn" style="background:#e9b1ff;">切换背景色</button>
        <p style="margin-top: 25px; font-size: 14px; color: #666;">by:ShiroiKasa<br>ver:web1.1.26_03_26_1</p>
    </div>

    <div id="stat" style="display: none;">
        <h2>统计</h2>
        <div class="counter_stat" id="Game_time">游戏时间:0</div>
        <div class="counter_stat" id="Quarks_MAX">最大夸克数量:0</div>
        <div class="counter_stat" id="h1_re_stat">夸克禁闭次数:0</div>
    </div>

    <script src="global_var.js"></script><!-- 变量加载 -->
    <script src="script_auto.js"></script><!-- 自动化加载 -->
    <script src="script.js"></script><!-- 存档和h1加载 -->
    <script src="script_cut.js"></script><!-- 切换界面加载 -->
    <script src="script_h2.js"></script>
</body>
</html>
